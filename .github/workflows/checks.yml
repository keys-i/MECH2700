name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        if: hashFiles('**/*.py', '**/*.tex') != ''
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Lint and check Python formatting
        if: hashFiles('**/*.py') != ''
        run: |
          mapfile -d '' files < <(find . -type f -name '*.py' -not -path './.git/*' -print0)
          uvx --from ruff==0.16.0 ruff check --output-format=github "${files[@]}"
          uvx --from ruff==0.16.0 ruff format --check --output-format=github "${files[@]}"

      - name: Lint and check LaTeX formatting
        if: hashFiles('**/*.tex') != ''
        run: |
          mapfile -d '' files < <(find . -type f -name '*.tex' -not -path './.git/*' -print0)
          uvx --from badness==0.10.0 badness lint "${files[@]}"
          uvx --from badness==0.10.0 badness format --check "${files[@]}"
