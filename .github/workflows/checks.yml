name: Checks

on:
  push:
    paths:
      - "**/*.py"
      - "**/*.tex"
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.tex"

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      tex: ${{ steps.filter.outputs.tex }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
            tex:
              - '**/*.tex'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version-file: pyproject.toml

      - name: Lint
        run: uv run lint py

      - name: Format
        run: uv run fmt py --check

      - name: Typecheck
        run: uv run typecheck

  tex:
    needs: changes
    if: needs.changes.outputs.tex == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version-file: pyproject.toml

      - name: Lint
        run: uv run lint tex

      - name: Format
        run: uv run fmt tex --check
