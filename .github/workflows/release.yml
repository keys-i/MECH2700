name: Release PDF

on:
  push:
    paths:
      - "**/*.tex"
      - "**/week_*.py"
  pull_request:
    paths:
      - "**/*.tex"
      - "**/week_*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pdf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Discover week TeX files
        id: tex
        shell: bash
        run: |
          mapfile -t files < <(find . -type f -name 'week_*.tex' ! -path './.git/*' | sed 's|^\./||' | sort)
          if ((${#files[@]} == 0)); then
            echo "::error::No week_*.tex files found"
            exit 1
          fi
          {
            echo "root_file<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          printf 'Found:\n'
          printf '  %s\n' "${files[@]}"

      - name: Compile PDFs
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ steps.tex.outputs.root_file }}
          work_in_root_file_dir: true
          latexmk_shell_escape: true
          extra_system_packages: py3-pygments

      - name: Package folder zips
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          declare -A weeks=()
          while IFS= read -r pdf; do
            dir=$(dirname "$pdf")
            base=$(basename "$pdf" .pdf)
            [[ "$base" =~ ^week_0*([0-9]+)$ ]] || continue
            num=${BASH_REMATCH[1]}
            mkdir -p "dist/.staging/${dir}"
            cp "$pdf" "dist/.staging/${dir}/W${num}.pdf"
            weeks["$dir"]=1
          done < <(find . -type f -name 'week_*.pdf' ! -path './.git/*' ! -path './dist/*' | sed 's|^\./||' | sort)

          if ((${#weeks[@]} == 0)); then
            echo "::error::No week_*.pdf outputs to package"
            exit 1
          fi

          for dir in "${!weeks[@]}"; do
            zip_name="$(basename "$dir").zip"
            (cd "dist/.staging/${dir}" && zip -X -q "../../${zip_name}" W*.pdf)
            echo "packed dist/${zip_name}:"
            unzip -l "dist/${zip_name}"
          done
          rm -rf dist/.staging

      - name: Upload zips
        uses: actions/upload-artifact@v7
        with:
          name: pdfs
          path: dist/*.zip
          if-no-files-found: error
