name: Release PDF

on:
  schedule:
    - cron: "0 13 * * 4"
      timezone: "Australia/Brisbane"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "**/*.tex"
      - "**/week_*.py"
      - "tools/script.py"
      - "tools/scripts/release.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-pdf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version-file: pyproject.toml

      - name: Set up Tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: 0.17.0

      - name: Compile PDFs
        shell: bash
        run: tools/scripts/release.sh compile

      - name: Package folder zips
        id: package
        shell: bash
        run: tools/scripts/release.sh package

      - name: Upload zips
        uses: actions/upload-artifact@v7
        with:
          name: pdfs
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: week-${{ steps.package.outputs.week }}
          target_commitish: ${{ github.sha }}
          name: Week ${{ steps.package.outputs.week }}
          body: |
            Coursework PDFs through Week ${{ steps.package.outputs.week }}, built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            Zips are named by folder (`prac.zip`, …) with `W1.pdf`, `W2.pdf`, …
          files: dist/*.zip
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true
